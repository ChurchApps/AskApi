service: ask-api

useDotenv: true

disableSchemaValidation: true

custom:
  stage: ${opt:stage, 'dev'}
  env: ${lower(${self:custom.stage})}
  layerName: ${self:service}-dependencies-${self:custom.stage}
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002
    useChildProcesses: true
    noTimeout: true

provider:
  name: aws
  runtime: nodejs22.x
  memorySize: 1024
  timeout: 60
  region: ${env:AWS_REGION, 'us-east-2'}
  # Stop retaining Lambda log groups forever. Log levels are set per function under resources.extensions.
  logRetentionInDays: 30
  stage: ${self:custom.stage}
  iam:
    role: arn:aws:iam::${aws:accountId}:role/ChurchAppsRole
  environment:
    APP_ENV: ${self:custom.env}

package:
  individually: true
  patterns:
    - "!.git/**"
    - "!.gitignore"
    - "!README.md"
    - "!*.md"
    - "!node_modules/**"
    - "!src/**"
    - "!tools/**"
    - "!playground/**"
    - "!package-lock.json"
    - "!tsconfig.json"
    - "!eslint.config.js"
    - "!dotenv.sample.txt"
    - "dist/**"
    - "lambda.js"

layers:
  dependencies:
    name: ${self:custom.layerName}
    path: layer
    retain: false

functions:
  api:
    name: ask-api-${self:custom.stage}-api
    handler: lambda.universal
    layers:
      - { Ref: DependenciesLambdaLayer }
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

plugins:
  - serverless-plugin-utils
  - serverless-offline

resources:
  # Lambda advanced logging. Serverless v3 has no provider.logs.lambda (that is v4), so it is patched onto each function.
  # JSON format maps console.debug/info/warn/error to levels; INFO drops console.debug, and systemLogLevel WARN drops
  # the per-invocation START/END/REPORT lines (Duration/Errors metrics are unaffected).
  # Add any new function here too.
  extensions:
    ApiLambdaFunction:
      Properties:
        LoggingConfig: &lambdaLogging
          LogFormat: JSON
          ApplicationLogLevel: INFO
          SystemLogLevel: WARN
